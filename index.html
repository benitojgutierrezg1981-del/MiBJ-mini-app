<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Mini App</title>
  <!-- SDK de Telegram -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #f0f2f5;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .card {
      background: white;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      text-align: center;
      max-width: 350px;
      width: 100%;
    }
    .status {
      background: #e8f5e9;
      color: #2e7d32;
      padding: 10px;
      border-radius: 8px;
      font-weight: bold;
      margin: 15px 0;
    }
    .btn {
      background-color: #25D366;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2 id="saludo">Cargando...</h2>
    <div id="status" class="status">⚡ Ejecutando proceso...</div>
    <p>Esta app se ejecuta en menos de 2 segundos.</p>
    <button class="btn" onclick="compartirWhatsApp()">Compartir en WhatsApp</button>
  </div>

  <script>
    // 1. Detectar Telegram
    const tg = window.Telegram?.WebApp;
    if (tg && tg.initDataUnsafe?.user) {
      tg.ready();
      tg.expand();
      document.getElementById('saludo').innerText = "¡Hola, " + tg.initDataUnsafe.user.first_name + "!";
    } else {
      document.getElementById('saludo').innerText = "¡Bienvenido a la Mini App!";
    }

    // 2. Ejecutar tarea automática en menos de 2 segundos
    window.addEventListener('load', () => {
      setTimeout(() => {
        document.getElementById('status').innerText = "✅ Tarea completada con éxito";
      }, 600);
    });

    // 3. Compartir en WhatsApp
    function compartirWhatsApp() {
      const enlace = encodeURIComponent(window.location.href);
      const texto = encodeURIComponent("¡Prueba esta Mini App instantánea! 👇\n" + window.location.href);
      window.open("https://api.whatsapp.com/send?text=" + texto, '_blank');
    }
  </script>
</body>
</html>
